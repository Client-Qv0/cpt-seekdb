[package]
name = "file-reader"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native Parquet decoding for seekdb file scans (no SQL execution)"

[lib]
name = "file_reader"
crate-type = ["staticlib", "rlib"]

[dependencies]
parquet = { version = "=56.2.0", default-features = false, features = ["snap", "flate2-rust_backened", "lz4", "zstd"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
