services:
  seekdb:
    image: oceanbase/seekdb:1.4.0-100000172026082615@sha256:4db4961869d554313520d6081fca29265ba6da6db7313311bd8acbed771a956b
    ports:
      - "127.0.0.1:2881:2881"
    environment:
      CPU_COUNT: "2"
      MEMORY_LIMIT: "2G"
      LOG_DISK_SIZE: "2G"
      DATAFILE_SIZE: "2G"
      DATAFILE_MAXSIZE: "6G"
      SEEKDB_DATABASE: "test"
    volumes:
      - seekdb-data:/var/lib/seekdb
volumes:
  seekdb-data:
